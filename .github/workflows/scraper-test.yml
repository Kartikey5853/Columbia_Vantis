name: Scraper Continuous Testing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      min_products:
        description: 'Minimum expected products/SKUs'
        required: false
        default: '1'
      deploy_wait_seconds:
        description: 'Maximum seconds to wait for Render deployment to become healthy'
        required: false
        default: '600'
      health_check_interval_seconds:
        description: 'Seconds between job status polls (default: 30s)'
        required: false
        default: '30'
      scrape_timeout_seconds:
        description: 'Timeout in seconds for scraper job completion'
        required: false
        default: '3900'

env:
  DEFAULT_RENDER_URL: "https://columbia-4-0.onrender.com"
  MIN_PRODUCTS: ${{ inputs.min_products || '1' }}
  RENDER_DEPLOY_WAIT_SECONDS: ${{ inputs.deploy_wait_seconds || '600' }}
  HEALTH_CHECK_INTERVAL_SECONDS: ${{ inputs.health_check_interval_seconds || '30' }}
  SCRAPE_TIMEOUT_SECONDS: ${{ inputs.scrape_timeout_seconds || '3900' }}

jobs:
  # =========================================================================
  # Asynchronous Multi-Scraper Pipeline:
  # 1. Health check & Render readiness
  # 2. Trigger POST /scrape (202 Accepted) & poll GET /scrape/status/{job_id} (every 5 mins)
  # 3. Generate combined CI summary table & step summary
  # 4. Upload test artifacts (JSON results & job trace)
  # =========================================================================
  test-scrapers:
    name: Async Scraper Testing (Columbia -> Tata CLiQ)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Create test results directory
        run: mkdir -p test-results

      - name: 1. Wait for Render deployment to be healthy
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          python .github/scripts/test_scraper.py \
            --wait-only \
            --service-url "${RENDER_SERVICE_URL}" \
            --deploy-wait-seconds "${RENDER_DEPLOY_WAIT_SECONDS}" \
            --health-check-interval 15

      - name: 2. Trigger async scraper job & poll status until completion (30s interval)
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          python .github/scripts/test_scraper.py \
            --poll-job \
            --service-url "${RENDER_SERVICE_URL}" \
            --min-products "${MIN_PRODUCTS}" \
            --scrape-timeout-seconds "${SCRAPE_TIMEOUT_SECONDS}" \
            --health-check-interval "${HEALTH_CHECK_INTERVAL_SECONDS}" \
            --results-dir "test-results" \
            --skip-wait

      - name: 3. Generate CI summary and step summary
        if: always()
        run: |
          python .github/scripts/test_scraper.py \
            --generate-summary \
            --results-dir "test-results"

      - name: 4. Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-results
          path: test-results/
          retention-days: 30
