name: Scraper Deploy Trigger Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force start scraping even if already completed today'
        required: false
        default: 'false'
      deploy_wait_seconds:
        description: 'Maximum seconds to wait for Render deployment to become healthy'
        required: false
        default: '300'

env:
  DEFAULT_RENDER_URL: "https://columbia-4-0.onrender.com"
  FORCE: ${{ inputs.force || 'false' }}
  RENDER_DEPLOY_WAIT_SECONDS: ${{ inputs.deploy_wait_seconds || '300' }}

jobs:
  # =========================================================================
  # Lightweight Deploy Trigger Pipeline:
  # 1. Wait for Render deployment to become healthy
  # 2. Automatically trigger POST /deploy-trigger endpoint
  # (Testing after deployment removed; reports are stored in database)
  # =========================================================================
  trigger-scrapers:
    name: Auto Deploy Trigger (Render Wakeup & Queue Trigger)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Wait for Render deployment to be healthy
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          python .github/scripts/test_scraper.py \
            --wait-only \
            --service-url "${RENDER_SERVICE_URL}" \
            --deploy-wait-seconds "${RENDER_DEPLOY_WAIT_SECONDS}" \
            --health-check-interval 10

      - name: 2. Trigger auto-scraper endpoint on server
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          echo "Triggering deploy hook at ${RENDER_SERVICE_URL}/deploy-trigger (force=${FORCE})..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${RENDER_SERVICE_URL}/deploy-trigger?force=${FORCE}" -H "Content-Type: application/json")
          HTTP_BODY=$(echo "${RESPONSE}" | head -n -1)
          HTTP_CODE=$(echo "${RESPONSE}" | tail -n 1)

          echo "Response HTTP Status: ${HTTP_CODE}"
          echo "Response Payload: ${HTTP_BODY}"

          if [ "${HTTP_CODE}" -eq 200 ] || [ "${HTTP_CODE}" -eq 202 ]; then
            echo "✅ Deploy trigger successfully received by server!"
          else
            echo "⚠️ Warning: Received unexpected HTTP code ${HTTP_CODE}"
          fi
