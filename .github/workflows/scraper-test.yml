name: Scraper Deployment Health & Verification Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_wait_seconds:
        description: 'Maximum seconds to wait for Render deployment to become healthy'
        required: false
        default: '600'
      health_check_interval_seconds:
        description: 'Seconds between health check polls (default: 15s)'
        required: false
        default: '15'

env:
  DEFAULT_RENDER_URL: "https://columbia-4-0.onrender.com"
  RENDER_DEPLOY_WAIT_SECONDS: ${{ inputs.deploy_wait_seconds || '600' }}
  HEALTH_CHECK_INTERVAL_SECONDS: ${{ inputs.health_check_interval_seconds || '15' }}

jobs:
  # =========================================================================
  # Render Deployment Verification:
  # 1. Health check & Render readiness.
  # 2. Closes successfully the moment the server is up and running properly.
  # =========================================================================
  verify-deployment:
    name: Verify Server Health & Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Wait for Render deployment to be healthy
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          python .github/scripts/test_scraper.py \
            --wait-only \
            --service-url "${RENDER_SERVICE_URL}" \
            --deploy-wait-seconds "${RENDER_DEPLOY_WAIT_SECONDS}" \
            --health-check-interval "${HEALTH_CHECK_INTERVAL_SECONDS}"

      - name: 2. Server is Up and Running
        run: |
          echo "Server is fully operational and responding to health checks. Pipeline closing."
