name: Scraper Continuous Testing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      min_products:
        description: 'Minimum expected products/SKUs'
        required: false
        default: '1'
      deploy_wait_seconds:
        description: 'Maximum seconds to wait for Render deployment to become healthy'
        required: false
        default: '600'
      health_check_interval_seconds:
        description: 'Seconds between health check polls'
        required: false
        default: '15'
      scrape_timeout_seconds:
        description: 'Timeout in seconds for each scraper endpoint request'
        required: false
        default: '2400'

env:
  DEFAULT_RENDER_URL: "https://columbia-4-0.onrender.com"
  MIN_PRODUCTS: ${{ inputs.min_products || '1' }}
  RENDER_DEPLOY_WAIT_SECONDS: ${{ inputs.deploy_wait_seconds || '600' }}
  HEALTH_CHECK_INTERVAL_SECONDS: ${{ inputs.health_check_interval_seconds || '15' }}
  SCRAPE_TIMEOUT_SECONDS: ${{ inputs.scrape_timeout_seconds || '2400' }}

jobs:
  # =========================================================================
  # Sequential Multi-Scraper Pipeline:
  # 1. Health check & Render readiness
  # 2. Test Columbia scraper (/scrape)
  # 3. Test Tata CLiQ scraper (/scrape/tata) [ONLY if Columbia passes]
  # 4. Generate combined CI summary table & step summary
  # 5. Upload test artifacts
  # =========================================================================
  test-scrapers:
    name: Sequential Scraper Testing (Columbia -> Tata CLiQ)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Create test results directory
        run: mkdir -p test-results

      - name: 1. Wait for Render deployment to be healthy
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
        run: |
          python .github/scripts/test_scraper.py \
            --wait-only \
            --service-url "${RENDER_SERVICE_URL}" \
            --deploy-wait-seconds "${RENDER_DEPLOY_WAIT_SECONDS}" \
            --health-check-interval "${HEALTH_CHECK_INTERVAL_SECONDS}"

      - name: 2. Test Columbia scraper (/scrape)
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          python .github/scripts/test_scraper.py \
            --service-url "${RENDER_SERVICE_URL}" \
            --source-name "columbia" \
            --endpoint "/scrape" \
            --min-products "${MIN_PRODUCTS}" \
            --scrape-timeout-seconds "${SCRAPE_TIMEOUT_SECONDS}" \
            --output-file "test-results/columbia-test-result.json" \
            --skip-wait

      - name: 3. Test Tata CLiQ scraper (/scrape/tata)
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || env.DEFAULT_RENDER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          python .github/scripts/test_scraper.py \
            --service-url "${RENDER_SERVICE_URL}" \
            --source-name "tatacliq" \
            --endpoint "/scrape/tata" \
            --min-products "${MIN_PRODUCTS}" \
            --scrape-timeout-seconds "${SCRAPE_TIMEOUT_SECONDS}" \
            --output-file "test-results/tata-test-result.json" \
            --skip-wait

      - name: 4. Generate CI summary and step summary
        if: always()
        run: |
          python .github/scripts/test_scraper.py \
            --generate-summary \
            --results-dir "test-results"

      - name: 5. Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-results
          path: test-results/
          retention-days: 30
